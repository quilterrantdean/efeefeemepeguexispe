name: FFmpeg XP (Sherpya)

# Compila o sherpya/ffmpeg (ffmpeg.exe, ffplay.exe, ffprobe.exe) para Windows XP (32 bits)
# optimizado para Pentium 4 HT Prescott (3GHz, SSE3) sempre que o repositorio original
# recebe novos commits na branch principal.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit/branch/tag upstream a compilar (vazio = ultimo commit)"
        required: false
        default: ""
      force:
        description: "Recompilar mesmo que a release ja exista (substitui-a)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ffmpeg-xp
  cancel-in-progress: false

env:
  UPSTREAM: sherpya/ffmpeg
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Verificar commits upstream
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.up.outputs.tag }}
      sha: ${{ steps.up.outputs.sha }}
      build: ${{ steps.up.outputs.build }}
    steps:
      - id: up
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT: ${{ inputs.commit }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_COMMIT" ]; then
            [[ "$INPUT_COMMIT" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::referencia invalida: $INPUT_COMMIT"; exit 1; }
            ref="$INPUT_COMMIT"
          else
            ref=$(gh api "repos/$UPSTREAM" --jq '.default_branch')
          fi

          commit_json=$(gh api "repos/$UPSTREAM/commits/$ref") \
            || { echo "::error::Nao foi possivel obter o commit '$ref' em $UPSTREAM"; exit 1; }

          sha=$(echo "$commit_json" | jq -r '.sha')
          short_sha="${sha:0:7}"
          commit_date=$(echo "$commit_json" | jq -r '.commit.committer.date' | cut -dT -f1 | tr -d '-')
          tag="git-${commit_date}-${short_sha}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            build=false
            echo "Release $tag ($sha) ja existe em $GITHUB_REPOSITORY; nada a fazer."
          else
            build=true
            echo "A compilar $tag (commit $sha)."
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Compilar (${{ matrix.variant }})
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        variant: [prescott] # generic desactivada temporariamente
    steps:
      - name: Instalar dependencias e toolchain MinGW-w64 (win32 threads)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686-win32 g++-mingw-w64-i686-win32 binutils-mingw-w64-i686 \
            mingw-w64-i686-dev nasm yasm pkg-config cmake make autoconf automake libtool \
            git curl wget ca-certificates xz-utils bzip2 zip jq
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-win32
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-win32

      - name: Compilar dependencias estaticas e FFmpeg
        env:
          TAG: ${{ needs.check.outputs.tag }}
          COMMIT_SHA: ${{ needs.check.outputs.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          WORKDIR="$GITHUB_WORKSPACE/build"
          SRC="$WORKDIR/src"
          PREFIX="$WORKDIR/prefix"
          LOGS="$WORKDIR/logs"
          REL="$WORKDIR/release"
          mkdir -p "$SRC" "$PREFIX/include" "$PREFIX/lib/pkgconfig" "$PREFIX/bin" "$LOGS" "$REL"

          # Em caso de erro em qualquer passo, imprime automaticamente os ultimos logs na consola
          trap '
            echo "::error::Falha na compilacao! Ultimas linhas dos logs:"
            for f in $(ls -t "$LOGS"/*.log 2>/dev/null | head -n 2); do
              echo "==================== $f ===================="
              tail -n 120 "$f" || true
            done
          ' ERR

          export PATH="$PREFIX/bin:$PATH"
          export PKG_CONFIG_DIR=""
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"
          JOBS=$(nproc)

          # Flags de compatibilidade estrita com Windows XP SP3 (NT 5.01)
          XP_CPPFLAGS="-D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -DLZMA_API_STATIC -DNDEBUG"
          XP_LDFLAGS="-Wl,--major-os-version=5 -Wl,--minor-os-version=1 -Wl,--major-subsystem-version=5 -Wl,--minor-subsystem-version=1 -Wl,--gc-sections -s"

          if [ "$VARIANT" = "prescott" ]; then
            # Pentium 4 HT Prescott (NetBurst): -O2 + vectorizacao evita saturar a Trace Cache (12K uOps),
            # enquanto -msse3 e -mfpmath=sse usam os registos SSE3 em vez da lenta FPU x87.
            CPU_FLAGS="-O2 -ftree-vectorize -march=prescott -mtune=prescott -msse3 -mfpmath=sse -fomit-frame-pointer -fno-stack-protector -ffunction-sections -fdata-sections -Wno-error"
            FF_CPU="prescott"
          else
            CPU_FLAGS="-O2 -march=i686 -mtune=generic -fomit-frame-pointer -fno-stack-protector -ffunction-sections -fdata-sections -Wno-error"
            FF_CPU="i686"
          fi

          export CFLAGS="$CPU_FLAGS $XP_CPPFLAGS"
          export CXXFLAGS="$CPU_FLAGS $XP_CPPFLAGS"
          export CPPFLAGS="$XP_CPPFLAGS -I$PREFIX/include"
          export LDFLAGS="$XP_LDFLAGS -L$PREFIX/lib"

          echo "=== [1/11] zlib ==="
          cd "$SRC"
          curl -fsSL https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz | tar -xJ
          cd zlib-1.3.1
          make -f win32/Makefile.gcc PREFIX=i686-w64-mingw32- CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" -j"$JOBS" >"$LOGS/zlib.log" 2>&1
          make -f win32/Makefile.gcc install BINARY_PATH="$PREFIX/bin" INCLUDE_PATH="$PREFIX/include" LIBRARY_PATH="$PREFIX/lib" SHARED_MODE=0 >>"$LOGS/zlib.log" 2>&1

          echo "=== [2/11] bzip2 ==="
          cd "$SRC"
          curl -fsSL https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz | tar -xz
          cd bzip2-1.0.8
          make CC="i686-w64-mingw32-gcc" AR="i686-w64-mingw32-ar" RANLIB="i686-w64-mingw32-ranlib" \
            CFLAGS="$CFLAGS -D_FILE_OFFSET_BITS=64" libbz2.a -j"$JOBS" >"$LOGS/bzip2.log" 2>&1
          cp -f bzlib.h "$PREFIX/include/"
          cp -f libbz2.a "$PREFIX/lib/"

          echo "=== [3/11] xz (liblzma com threads win95/xp) ==="
          cd "$SRC"
          curl -fsSL https://github.com/tukaani-project/xz/releases/download/v5.4.7/xz-5.4.7.tar.xz | tar -xJ
          cd xz-5.4.7
          ./configure --host=i686-w64-mingw32 --prefix="$PREFIX" --enable-static --disable-shared \
            --enable-threads=win95 --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo \
            --disable-scripts --disable-doc >"$LOGS/xz.log" 2>&1
          make -j"$JOBS" >>"$LOGS/xz.log" 2>&1
          make install >>"$LOGS/xz.log" 2>&1

          echo "=== [4/11] libiconv ==="
          cd "$SRC"
          curl -fsSL https://ftp.gnu.org/gnu/libiconv/libiconv-1.17.tar.gz | tar -xz
          cd libiconv-1.17
          ./configure --host=i686-w64-mingw32 --prefix="$PREFIX" --enable-static --disable-shared --disable-nls >"$LOGS/iconv.log" 2>&1
          make -j"$JOBS" >>"$LOGS/iconv.log" 2>&1
          make install >>"$LOGS/iconv.log" 2>&1

          echo "=== [5/11] mbedtls (suporte HTTPS/TLS 1.2 em XP) ==="
          cd "$SRC"
          curl -fsSL https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v2.28.8.tar.gz | tar -xz
          cd mbedtls-2.28.8
          make CC="i686-w64-mingw32-gcc" AR="i686-w64-mingw32-ar" WINDOWS=1 CFLAGS="$CFLAGS" lib -j"$JOBS" >"$LOGS/mbedtls.log" 2>&1
          cp -r include/mbedtls include/psa "$PREFIX/include/"
          cp library/*.a "$PREFIX/lib/"
          cat > "$PREFIX/lib/pkgconfig/mbedtls.pc" <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include
          Name: mbedtls
          Description: Mbed TLS
          Version: 2.28.8
          Libs: -L\${libdir} -lmbedtls -lmbedx509 -lmbedcrypto -lws2_32 -lcrypt32 -ladvapi32
          Cflags: -I\${includedir}
          EOF
          sed -i 's/^[[:space:]]*//' "$PREFIX/lib/pkgconfig/mbedtls.pc"

          echo "=== [6/11] SDL2 (necessario para ffplay.exe; Direct3D9/OpenGL/DirectSound) ==="
          cd "$SRC"
          curl -fsSL https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz | tar -xz
          cd SDL2-2.28.5
          ./configure --host=i686-w64-mingw32 --prefix="$PREFIX" --enable-static --disable-shared \
            --disable-sensor --disable-hidapi --disable-power --disable-haptic >"$LOGS/sdl2.log" 2>&1
          make -j"$JOBS" >>"$LOGS/sdl2.log" 2>&1
          make install >>"$LOGS/sdl2.log" 2>&1

          echo "=== [7/11] libogg & libvorbis ==="
          cd "$SRC"
          curl -fsSL https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.xz | tar -xJ
          cd libogg-1.3.5
          ./configure --host=i686-w64-mingw32 --prefix="$PREFIX" --enable-static --disable-shared >"$LOGS/ogg.log" 2>&1
          make -j"$JOBS" >>"$LOGS/ogg.log" 2>&1
          make install >>"$LOGS/ogg.log" 2>&1

          cd "$SRC"
          curl -fsSL https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz | tar -xJ
          cd libvorbis-1.3.7
          ./configure --host=i686-w64-mingw32 --prefix="$PREFIX" --enable-static --disable-shared --disable-oggtest >"$LOGS/vorbis.log" 2>&1
          make -j"$JOBS" >>"$LOGS/vorbis.log" 2>&1
          make install >>"$LOGS/vorbis.log" 2>&1

          echo "=== [8/11] libopus ==="
          cd "$SRC"
          curl -fsSL https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz | tar -xz
          cd opus-1.5.2
          ./configure --host=i686-w64-mingw32 --prefix="$PREFIX" --enable-static --disable-shared \
            --disable-stack-protector --disable-doc --disable-extra-programs >"$LOGS/opus.log" 2>&1
          make -j"$JOBS" >>"$LOGS/opus.log" 2>&1
          make install >>"$LOGS/opus.log" 2>&1

          echo "=== [9/11] libmp3lame ==="
          cd "$SRC"
          curl -fsSL https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz | tar -xz
          cd lame-3.100
          ./configure --host=i686-w64-mingw32 --prefix="$PREFIX" --enable-static --disable-shared \
            --enable-nasm --disable-frontend --disable-decoder >"$LOGS/lame.log" 2>&1
          make -j"$JOBS" >>"$LOGS/lame.log" 2>&1
          make install >>"$LOGS/lame.log" 2>&1

          echo "=== [10/11] xvidcore & x264 ==="
          cd "$SRC"
          curl -fsSL https://downloads.xvid.com/downloads/xvidcore-1.3.7.tar.gz | tar -xz
          cd xvidcore/build/generic
          sed -i 's/-mno-cygwin//g' configure
          ./configure --build=x86_64-pc-linux-gnu --host=i686-w64-mingw32 --prefix="$PREFIX" >"$LOGS/xvid.log" 2>&1
          mkdir -p "=build"
          make -j"$JOBS" "=build/xvidcore.a" >>"$LOGS/xvid.log" 2>&1
          cp -f ../../src/xvid.h "$PREFIX/include/xvid.h"
          cp -f "=build/xvidcore.a" "$PREFIX/lib/libxvidcore.a"

          cd "$SRC"
          git clone --depth 1 --branch stable https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --host=i686-w64-mingw32 --cross-prefix=i686-w64-mingw32- --prefix="$PREFIX" \
            --enable-static --enable-strip --enable-win32thread --disable-cli --disable-swscale --disable-lavf \
            --extra-cflags="$CFLAGS" --extra-ldflags="$LDFLAGS" >"$LOGS/x264.log" 2>&1
          make -j"$JOBS" >>"$LOGS/x264.log" 2>&1
          make install >>"$LOGS/x264.log" 2>&1

          echo "=== [11/11] sherpya/ffmpeg ($COMMIT_SHA) ==="
          mkdir -p "$SRC/ffmpeg"
          cd "$SRC/ffmpeg"
          git init
          git remote add origin "https://github.com/$UPSTREAM.git"
          git fetch --depth 1 origin "$COMMIT_SHA"
          git checkout FETCH_HEAD

          # Impede o configure do FFmpeg de forcar _WIN32_WINNT=0x0600 (Vista+)
          sed -i 's/_WIN32_WINNT >= 0x060[0-9]/_WIN32_WINNT >= 0x0501/g' configure
          sed -i 's/-D_WIN32_WINNT=0x060[0-9]/-D_WIN32_WINNT=0x0501/g' configure

          # Caso o compat/w32pthreads.h nao tenha ja o fallback de XP do Sherpya (_WIN32_WINNT >= 0x0600),
          # injecta implementacao compativel com Windows XP usando macros (sem conflito de tipos com synchapi.h)
          if [ -f compat/w32pthreads.h ] && ! grep -q "0x0600" compat/w32pthreads.h; then
            cat > compat/xp_sync_fallback.h << 'XPEOF'
          #ifndef FF_XP_SYNC_FALLBACK
          #define FF_XP_SYNC_FALLBACK
          #include <windows.h>

          typedef struct { PVOID Ptr; } ff_xp_srwlock_t;
          typedef struct { PVOID Ptr; } ff_xp_cond_t;
          typedef struct { PVOID Ptr; } ff_xp_once_t;
          typedef BOOL (WINAPI *ff_xp_once_fn)(ff_xp_once_t*, PVOID, PVOID*);

          static inline CRITICAL_SECTION* ff_xp_srw_cs(ff_xp_srwlock_t *lock) {
              CRITICAL_SECTION *cs = (CRITICAL_SECTION*)lock->Ptr;
              if (!cs) {
                  CRITICAL_SECTION *ncs = (CRITICAL_SECTION*)HeapAlloc(GetProcessHeap(), HEAP_ZERO_MEMORY, sizeof(CRITICAL_SECTION));
                  InitializeCriticalSection(ncs);
                  if (InterlockedCompareExchangePointer(&lock->Ptr, ncs, NULL) != NULL) {
                      DeleteCriticalSection(ncs);
                      HeapFree(GetProcessHeap(), 0, ncs);
                  }
                  cs = (CRITICAL_SECTION*)lock->Ptr;
              }
              return cs;
          }
          static inline void ff_xp_InitializeSRWLock(ff_xp_srwlock_t *lock) { lock->Ptr = NULL; }
          static inline void ff_xp_AcquireSRWLockExclusive(ff_xp_srwlock_t *lock) { EnterCriticalSection(ff_xp_srw_cs(lock)); }
          static inline void ff_xp_ReleaseSRWLockExclusive(ff_xp_srwlock_t *lock) { LeaveCriticalSection(ff_xp_srw_cs(lock)); }

          typedef struct { CRITICAL_SECTION cs; HANDLE sem; LONG waiters; } ff_xp_cv_internal_t;
          static inline ff_xp_cv_internal_t* ff_xp_cv_get(ff_xp_cond_t *cv) {
              ff_xp_cv_internal_t *c = (ff_xp_cv_internal_t*)cv->Ptr;
              if (!c) {
                  ff_xp_cv_internal_t *nc = (ff_xp_cv_internal_t*)HeapAlloc(GetProcessHeap(), HEAP_ZERO_MEMORY, sizeof(ff_xp_cv_internal_t));
                  InitializeCriticalSection(&nc->cs);
                  nc->sem = CreateSemaphoreW(NULL, 0, 0x7fffffff, NULL);
                  nc->waiters = 0;
                  if (InterlockedCompareExchangePointer(&cv->Ptr, nc, NULL) != NULL) {
                      CloseHandle(nc->sem);
                      DeleteCriticalSection(&nc->cs);
                      HeapFree(GetProcessHeap(), 0, nc);
                  }
                  c = (ff_xp_cv_internal_t*)cv->Ptr;
              }
              return c;
          }
          static inline void ff_xp_InitializeConditionVariable(ff_xp_cond_t *cv) { cv->Ptr = NULL; }
          static inline BOOL ff_xp_SleepConditionVariableCS(ff_xp_cond_t *cv, PCRITICAL_SECTION cs, DWORD ms) {
              ff_xp_cv_internal_t *c = ff_xp_cv_get(cv);
              EnterCriticalSection(&c->cs);
              c->waiters++;
              LeaveCriticalSection(&c->cs);
              LeaveCriticalSection(cs);
              DWORD r = WaitForSingleObject(c->sem, ms);
              if (r != WAIT_OBJECT_0) {
                  EnterCriticalSection(&c->cs);
                  if (c->waiters > 0) c->waiters--;
                  LeaveCriticalSection(&c->cs);
              }
              EnterCriticalSection(cs);
              if (r != WAIT_OBJECT_0) { SetLastError(ERROR_TIMEOUT); return FALSE; }
              return TRUE;
          }
          static inline BOOL ff_xp_SleepConditionVariableSRW(ff_xp_cond_t *cv, ff_xp_srwlock_t *lock, DWORD ms, ULONG flags) {
              (void)flags;
              return ff_xp_SleepConditionVariableCS(cv, ff_xp_srw_cs(lock), ms);
          }
          static inline void ff_xp_WakeConditionVariable(ff_xp_cond_t *cv) {
              ff_xp_cv_internal_t *c = ff_xp_cv_get(cv);
              EnterCriticalSection(&c->cs);
              if (c->waiters > 0) { c->waiters--; ReleaseSemaphore(c->sem, 1, NULL); }
              LeaveCriticalSection(&c->cs);
          }
          static inline void ff_xp_WakeAllConditionVariable(ff_xp_cond_t *cv) {
              ff_xp_cv_internal_t *c = ff_xp_cv_get(cv);
              EnterCriticalSection(&c->cs);
              if (c->waiters > 0) { ReleaseSemaphore(c->sem, c->waiters, NULL); c->waiters = 0; }
              LeaveCriticalSection(&c->cs);
          }
          static inline BOOL ff_xp_InitOnceExecuteOnce(ff_xp_once_t *once, ff_xp_once_fn fn, PVOID param, PVOID *ctx) {
              for (;;) {
                  LONG state = (LONG)(INT_PTR)InterlockedCompareExchangePointer(&once->Ptr, (PVOID)1, (PVOID)0);
                  if (state == 0) {
                      fn(once, param, ctx);
                      InterlockedExchangePointer(&once->Ptr, (PVOID)2);
                      return TRUE;
                  }
                  if (state == 2) return TRUE;
                  Sleep(0);
              }
          }

          #define SRWLOCK ff_xp_srwlock_t
          #define PSRWLOCK ff_xp_srwlock_t*
          #undef SRWLOCK_INIT
          #define SRWLOCK_INIT {0}
          #define InitializeSRWLock ff_xp_InitializeSRWLock
          #define AcquireSRWLockExclusive ff_xp_AcquireSRWLockExclusive
          #define ReleaseSRWLockExclusive ff_xp_ReleaseSRWLockExclusive

          #define CONDITION_VARIABLE ff_xp_cond_t
          #define PCONDITION_VARIABLE ff_xp_cond_t*
          #undef CONDITION_VARIABLE_INIT
          #define CONDITION_VARIABLE_INIT {0}
          #define InitializeConditionVariable ff_xp_InitializeConditionVariable
          #define SleepConditionVariableCS ff_xp_SleepConditionVariableCS
          #define SleepConditionVariableSRW ff_xp_SleepConditionVariableSRW
          #define WakeConditionVariable ff_xp_WakeConditionVariable
          #define WakeAllConditionVariable ff_xp_WakeAllConditionVariable

          #define INIT_ONCE ff_xp_once_t
          #define PINIT_ONCE ff_xp_once_t*
          #define LPINIT_ONCE ff_xp_once_t*
          #define PINIT_ONCE_FN ff_xp_once_fn
          #undef INIT_ONCE_STATIC_INIT
          #define INIT_ONCE_STATIC_INIT {0}
          #define InitOnceExecuteOnce ff_xp_InitOnceExecuteOnce

          #endif /* FF_XP_SYNC_FALLBACK */
          XPEOF
            sed -i 's/^[[:space:]]*//' compat/xp_sync_fallback.h
            sed -i '/#include <windows.h>/a #include "xp_sync_fallback.h"' compat/w32pthreads.h
          fi

          # Garante que nas diferentes revisoes do sherpya/ffmpeg apenas passamos flags suportadas
          EXTRA_FF_FLAGS=()
          for opt in \
            --disable-bcrypt \
            --disable-mediafoundation \
            --disable-d3d11va \
            --disable-d3d12va \
            --disable-dxva2 \
            --disable-vulkan \
            --disable-schannel \
            --disable-indev=wasapi \
            --disable-outdev=wasapi; do
            base_opt="${opt%%=*}"
            if ./configure --help | grep -q -- "$base_opt"; then
              EXTRA_FF_FLAGS+=("$opt")
            fi
          done

          ./configure \
            --prefix="$PREFIX" \
            --arch=x86_32 \
            --cpu="$FF_CPU" \
            --target-os=mingw32 \
            --cross-prefix=i686-w64-mingw32- \
            --pkg-config=pkg-config \
            --pkg-config-flags="--static" \
            --optflags="$CPU_FLAGS" \
            --extra-cflags="$CFLAGS -I$PREFIX/include" \
            --extra-cxxflags="$CXXFLAGS -I$PREFIX/include" \
            --extra-ldflags="$LDFLAGS -L$PREFIX/lib -static -static-libgcc -static-libstdc++ -s" \
            --extra-libs="-lws2_32 -lwinmm -lgdi32 -lole32 -loleaut32 -limm32 -lversion -luuid -ladvapi32 -lshell32 -lsetupapi -lcrypt32 -lm" \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --enable-version3 \
            --enable-w32threads \
            --disable-pthreads \
            --enable-runtime-cpudetect \
            --enable-ffmpeg \
            --enable-ffplay \
            --enable-ffprobe \
            --disable-doc \
            --disable-debug \
            --enable-stripping \
            --enable-zlib \
            --enable-bzlib \
            --enable-lzma \
            --enable-iconv \
            --enable-sdl2 \
            --enable-mbedtls \
            --enable-libmp3lame \
            --enable-libvorbis \
            --enable-libopus \
            --enable-libx264 \
            --enable-libxvid \
            "${EXTRA_FF_FLAGS[@]}" >"$LOGS/ffmpeg_configure.log" 2>&1 || {
              cat "$LOGS/ffmpeg_configure.log"
              [ -f ffbuild/config.log ] && cp ffbuild/config.log "$LOGS/config.log" && tail -n 120 ffbuild/config.log
              exit 1
            }

          make -j"$JOBS" >"$LOGS/ffmpeg_build.log" 2>&1
          make install >>"$LOGS/ffmpeg_build.log" 2>&1

          # Strip total de simbolos e validacao de binarios XP
          STAGE="$WORKDIR/package/ffmpeg-${TAG}-xp_${VARIANT}"
          mkdir -p "$STAGE"
          for bin in ffmpeg.exe ffplay.exe ffprobe.exe; do
            if [ ! -f "$PREFIX/bin/$bin" ]; then
              echo "::error::Binario $bin nao foi gerado!"
              exit 1
            fi
            i686-w64-mingw32-strip --strip-all "$PREFIX/bin/$bin" -o "$STAGE/$bin"

            dump=$(i686-w64-mingw32-objdump -p "$STAGE/$bin")
            dlls=$(echo "$dump" | awk '/DLL Name:/{print $3}')
            echo "DLLs importadas por $bin:"
            echo "$dlls"
            if echo "$dlls" | grep -Eqi '^(bcrypt|ncrypt|mfplat|d3d11|dxva2|libwinpthread|libssp|libgcc|libstdc\+\+).*\.dll$'; then
              echo "::error::$bin importa DLL incompativel ou nao-estatica!"
              exit 1
            fi
          done

          cp -f COPYING* LICENSE* README* "$STAGE/" 2>/dev/null || true
          (cd "$WORKDIR/package" && zip -9 -r "$REL/ffmpeg-${TAG}-xp_${VARIANT}.zip" "ffmpeg-${TAG}-xp_${VARIANT}")

      - name: Guardar pacote
        uses: actions/upload-artifact@v4
        with:
          name: xp_${{ matrix.variant }}
          path: build/release/*.zip
          if-no-files-found: error

      - name: Guardar logs (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs_${{ matrix.variant }}
          path: build/logs
          if-no-files-found: ignore

  release:
    name: Publicar release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xp_*
          path: dist
          merge-multiple: true

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          gh api "repos/$UPSTREAM/commits/$SHA" > up.json
          url=$(jq -r '.html_url' up.json)
          published=$(jq -r '.commit.committer.date' up.json)
          author=$(jq -r '.author.login // .commit.author.name // "desconhecido"' up.json)
          short_sha="${SHA:0:7}"

          jq -r '.commit.message // ""' up.json \
            | sed -E "s@(^|[^A-Za-z0-9/&])#([0-9]+)@\1${UPSTREAM}#\2@g" > body.md

          {
            echo "> **Build nao oficial para Windows XP (32 bits)** do commit [\`${short_sha}\`](${url}) de \`${UPSTREAM}\`."
            echo "> Data do commit original: ${published} por **${author}**."
            echo ">"
            echo "> | Ficheiro | Optimizacao |"
            echo "> |---|---|"
            echo "> | \`ffmpeg-${TAG}-xp_prescott.zip\` | Pentium 4 HT Prescott 3GHz (\`-O2 -ftree-vectorize -march=prescott -msse3 -mfpmath=sse\`) |"
            echo ">"
            echo "> **Inclui:** \`ffmpeg.exe\`, \`ffplay.exe\` e \`ffprobe.exe\` (100% estaticos, stripped, Subsystem 5.01 / Windows XP SP3)."
            echo "> **Bibliotecas integradas:** SDL2 (Direct3D 9 / OpenGL / DirectSound / WinMM), x264, Xvid, LAME MP3, Opus, Vorbis, MbedTLS (HTTPS/TLS 1.2), zlib, bzip2, lzma, iconv."
            echo ""
            echo "---"
            echo "### Mensagem do commit upstream"
            echo ""
            cat body.md
          } > notes.md

          (cd dist && sha256sum ./*.zip | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS)

          if [ "${FORCE:-}" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          fi

          default_branch=$(gh api "repos/$UPSTREAM" --jq '.default_branch')
          latest_sha=$(gh api "repos/$UPSTREAM/commits/$default_branch" --jq '.sha')
          if [ "$SHA" = "$latest_sha" ]; then latest=true; else latest=false; fi

          gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg XP ${TAG}" \
            --notes-file notes.md \
            --latest="$latest"
