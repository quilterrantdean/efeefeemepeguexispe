name: FFmpeg XP (sherpya)

# Compila o ULTIMO commit do master de sherpya/FFmpeg para Windows XP (32 bits).
# Nao usa tags nem releases do original (nao sao actualizadas): o master e sempre
# rebaseado, por isso a versao e o proprio commit (N-<n commits>-g<sha>).
#
# Corre:
#   - manualmente (Actions > FFmpeg XP (sherpya) > Run workflow)
#   - em cada push que altere este ficheiro
#
# Variantes: prescott (Pentium 4 Prescott, SSE3) e generic (i686, sem SSE).
# Saida: build/release/xp_<variante>/ (exes estaticos e sem simbolos) + zip,
# publicados numa release com o nome do commit.

on:
  push:
    paths:
      - ".github/workflows/ffmpeg-xp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-xp
  cancel-in-progress: false

env:
  UPSTREAM: sherpya/FFmpeg
  BRANCH: master

jobs:
  prepare:
    name: Obter ultimo commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.up.outputs.sha }}
      name: ${{ steps.up.outputs.name }}
    steps:
      - id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$UPSTREAM/commits/$BRANCH" --jq .sha)
          # O numero de commits (N-<n>) precisa do historico; clone sem blobs e rapido
          git clone -q --filter=blob:none --no-checkout "https://github.com/$UPSTREAM.git" ff
          git -C ff fetch -q origin "$sha" 2>/dev/null || true
          count=$(git -C ff rev-list --count "$sha")
          name="N-${count}-g${sha:0:7}"
          echo "A compilar $name ($sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  build:
    name: Compilar (${{ matrix.variant }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        variant: [prescott, generic]
    steps:
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686-posix g++-mingw-w64-i686-posix binutils-mingw-w64-i686 \
            mingw-w64-i686-dev libz-mingw-w64-dev cmake make git curl ca-certificates \
            xz-utils bzip2 zip nasm yasm pkg-config perl

      - name: Compilar
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_NAME: ${{ needs.prepare.outputs.name }}
        run: |
          #!/usr/bin/env bash
          # Receita: FFmpeg (sherpya) para Windows XP 32 bits, compilacao cruzada com mingw-w64.
          # Variaveis: VARIANT (prescott|generic), SHA (commit do sherpya/FFmpeg), BUILD_NAME (ex.: N-125989-g073e908)
          set -euo pipefail
          : "${VARIANT:?}" "${SHA:?}" "${BUILD_NAME:?}"
          JOBS="${JOBS:-$(nproc)}"
          ROOT="$(pwd)"
          W="${WORK:-$ROOT/work}"
          OUT="${OUTDIR:-$ROOT/build/release/xp_$VARIANT}"
          TARGET=i686-w64-mingw32
          PREFIX="$W/prefix"
          export PATH="$W/tc/bin:$PATH"
          mkdir -p "$W"/{dl,src,tc/bin,logs} "$PREFIX"

          case "$VARIANT" in
            prescott) CPU=prescott; ARCH_FLAGS="-march=prescott -mtune=prescott -mfpmath=sse" ;;
            generic)  CPU=i686;     ARCH_FLAGS="-march=i686 -mtune=generic" ;;
            *) echo "variante invalida: $VARIANT" >&2; exit 1 ;;
          esac
          CF="$ARCH_FLAGS -O2 -D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -DPSAPI_VERSION=1 -ffunction-sections -fdata-sections"

          log()  { echo "== $* =="; }
          run()  { local n="$1"; shift; if ! "$@" >"$W/logs/$n.log" 2>&1; then echo "FALHOU: $n" >&2; tail -n 60 "$W/logs/$n.log" >&2; return 1; fi; }

          # --- toolchain: symlinks sem sufixo -posix -----------------------------------
          for t in gcc g++ gcc-ar gcc-ranlib gcc-nm; do ln -sf "$(command -v ${TARGET}-${t}-posix)" "$W/tc/bin/${TARGET}-${t}"; done
          for t in windres ar ranlib strip objdump nm dlltool; do ln -sf "$(command -v ${TARGET}-${t})" "$W/tc/bin/${TARGET}-${t}"; done
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"; export PKG_CONFIG_PATH=""

          cat > "$W/toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_VERSION 5.1)
          set(CMAKE_SYSTEM_PROCESSOR i686)
          set(CMAKE_C_COMPILER   $W/tc/bin/${TARGET}-gcc)
          set(CMAKE_CXX_COMPILER $W/tc/bin/${TARGET}-g++)
          set(CMAKE_RC_COMPILER  $W/tc/bin/${TARGET}-windres)
          set(CMAKE_FIND_ROOT_PATH $PREFIX /usr/${TARGET})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          set(CMAKE_C_FLAGS_INIT   "$CF")
          set(CMAKE_CXX_FLAGS_INIT "$CF")
          set(CMAKE_C_FLAGS_RELEASE_INIT   "-O2 -DNDEBUG")
          set(CMAKE_CXX_FLAGS_RELEASE_INIT "-O2 -DNDEBUG")
          EOF

          # --- utilidades ------------------------------------------------------------------
          fetch() { # url sha256 ficheiro
            local f="$W/dl/$3"
            [ -f "$f" ] || curl -fsSL --retry 3 -o "$f.part" "$1" && { [ -f "$f" ] || mv "$f.part" "$f"; }
            echo "$2  $f" | sha256sum -c --quiet - || { echo "SHA256 invalido: $3" >&2; exit 1; }
          }
          untar() { # ficheiro destino
            rm -rf "$W/src/$2"; mkdir -p "$W/src/$2"; tar -xf "$W/dl/$1" -C "$W/src/$2" --strip-components=1
          }
          gitc() { # destino commit-ou-tag url...
            local d="$W/src/$1" ref="$2"; shift 2
            rm -rf "$d"
            local u
            for u in "$@"; do git clone -q "$u" "$d" 2>/dev/null && break || rm -rf "$d"; done
            [ -d "$d/.git" ] || { echo "falhou o clone de $1" >&2; exit 1; }
            git -C "$d" checkout -q "$ref"
          }
          cmake_dep() { # nome srcdir args...
            local n="$1" s="$2"; shift 2
            rm -rf "$W/b-$n"
            run "$n-cfg" cmake -S "$s" -B "$W/b-$n" -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE="$W/toolchain.cmake" \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_PREFIX_PATH="$PREFIX" \
                -DBUILD_SHARED_LIBS=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 "$@"
            run "$n-build" cmake --build "$W/b-$n" -j "$JOBS"
            run "$n-inst"  cmake --install "$W/b-$n"
          }

          # --- fontes (versoes fixas) ----------------------------------------------------------
          log "A obter fontes"
          fetch https://github.com/xiph/ogg/releases/download/v1.3.5/libogg-1.3.5.tar.gz 0eb4b4b9420a0f51db142ba3f9c64b333f826532dc0f48c6410ae51f4799b664 libogg.tgz
          fetch https://github.com/xiph/vorbis/releases/download/v1.3.7/libvorbis-1.3.7.tar.gz 0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab libvorbis.tgz
          fetch https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz 65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1 opus.tgz
          fetch http://archive.ubuntu.com/ubuntu/pool/main/l/lame/lame_3.100.orig.tar.gz ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e lame.tgz
          fetch https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2 a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6 mbedtls.tbz
          for n in libogg libvorbis opus lame; do untar "$n.tgz" "$n"; done
          untar mbedtls.tbz mbedtls
          gitc x264     31e19f92f00c7003fa115047ce50978bc98c3a0d https://code.videolan.org/videolan/x264.git https://github.com/mirror/x264.git
          gitc libvpx   v1.15.0     https://github.com/webmproject/libvpx.git
          gitc freetype VER-2-13-3  https://github.com/freetype/freetype.git
          gitc SDL2     release-2.32.10 https://github.com/libsdl-org/SDL.git

          # --- shim: GetTickCount64 (winpthreads), BCryptGenRandom e _vsnprintf_s (mbedtls): nao existem no XP
          cat > "$W/xp_shim.c" <<'EOF'
          #include <windows.h>
          static LONG  g_lock  = 0;
          static DWORD g_last  = 0;
          static DWORD g_wraps = 0;
          static ULONGLONG WINAPI xp_GetTickCount64(void)
          {
              DWORD now = GetTickCount();
              ULONGLONG r;
              while (InterlockedExchange(&g_lock, 1)) Sleep(0);
              if (now < g_last) g_wraps++;
              g_last = now;
              r = ((ULONGLONG)g_wraps << 32) | now;
              InterlockedExchange(&g_lock, 0);
              return r;
          }
          void *xp_imp_GetTickCount64 __asm__("__imp__GetTickCount64@0") = (void *)xp_GetTickCount64;

          /* mbedtls usa _vsnprintf_s (msvcrt.dll do Vista em diante): implementa-se com _vsnprintf */
          #include <stdarg.h>
          #include <stddef.h>
          int __cdecl _vsnprintf(char *, size_t, const char *, va_list);
          int xp_vsnprintf_s(char *buf, size_t size, size_t count, const char *fmt, va_list ap) __asm__("_vsnprintf_s");
          int xp_vsnprintf_s(char *buf, size_t size, size_t count, const char *fmt, va_list ap)
          {
              size_t limit;
              int r;
              if (!buf || !size || !fmt) return -1;
              limit = size - 1;
              if (count != (size_t)-1 && count < limit) limit = count;
              r = _vsnprintf(buf, limit, fmt, ap);
              if (r < 0 || (size_t)r > limit) { buf[limit] = 0; return -1; }
              buf[r] = 0;
              return r;
          }

          /* mbedtls 3.6 usa BCryptGenRandom (bcrypt.dll, so Vista+): implementa-se com CryptGenRandom */
          LONG WINAPI BCryptGenRandom(void *alg, UCHAR *buf, ULONG len, ULONG flags)
          {
              HCRYPTPROV prov;
              BOOL ok;
              (void)alg; (void)flags;
              if (!CryptAcquireContextA(&prov, NULL, NULL, PROV_RSA_FULL, CRYPT_VERIFYCONTEXT | CRYPT_SILENT))
                  return (LONG)0xC0000001;
              ok = CryptGenRandom(prov, len, buf);
              CryptReleaseContext(prov, 0);
              return ok ? 0 : (LONG)0xC0000001;
          }
          EOF
          run shim ${TARGET}-gcc $CF -c "$W/xp_shim.c" -o "$W/xp_shim.o"

          # --- bibliotecas ------------------------------------------------------------------------
          log "libogg / libvorbis / opus"
          cmake_dep ogg    "$W/src/libogg"    -DINSTALL_DOCS=OFF -DBUILD_TESTING=OFF
          cmake_dep vorbis "$W/src/libvorbis" -DBUILD_TESTING=OFF
          cmake_dep opus   "$W/src/opus" -DOPUS_BUILD_SHARED_LIBRARY=OFF -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF \
              -DOPUS_STACK_PROTECTOR=OFF -DOPUS_FORTIFY_SOURCE=OFF

          log "mbedtls (TLS)"
          cmake_dep mbedtls "$W/src/mbedtls" -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF -DUSE_SHARED_MBEDTLS_LIBRARY=OFF \
              -DUSE_STATIC_MBEDTLS_LIBRARY=ON -DMBEDTLS_FATAL_WARNINGS=OFF

          log "freetype"
          cmake_dep freetype "$W/src/freetype" -DFT_DISABLE_ZLIB=ON -DFT_DISABLE_BZIP2=ON -DFT_DISABLE_PNG=ON \
              -DFT_DISABLE_HARFBUZZ=ON -DFT_DISABLE_BROTLI=ON

          log "SDL2 (ffplay)"
          cmake_dep SDL2 "$W/src/SDL2" -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_TESTS=OFF \
              -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF -DSDL_HIDAPI=OFF -DSDL_SENSOR=OFF -DSDL_POWER=OFF -DSDL_LOCALE=OFF \
              -DSDL_WASAPI=OFF -DSDL_XINPUT=OFF -DSDL_DIRECTX=ON -DSDL_RENDER_D3D=ON -DSDL_OPENGL=ON
          # ffplay deve ficar como aplicacao de consola (sem -mwindows)
          sed -i -e 's/ *-mwindows//g' "$PREFIX/lib/pkgconfig/sdl2.pc"

          log "LAME"
          ( cd "$W/src/lame" && run lame-cfg ./configure --host=$TARGET --prefix="$PREFIX" --disable-shared --enable-static \
              --disable-frontend --disable-decoder --disable-gtktest CFLAGS="$CF" )
          run lame-build make -C "$W/src/lame" -j"$JOBS"
          run lame-inst  make -C "$W/src/lame" install

          log "x264"
          ( cd "$W/src/x264" && run x264-cfg ./configure --host=$TARGET --cross-prefix=${TARGET}- --prefix="$PREFIX" \
              --enable-static --disable-cli --disable-opencl --extra-cflags="$CF" )
          run x264-build make -C "$W/src/x264" -j"$JOBS"
          run x264-inst  make -C "$W/src/x264" install

          log "libvpx"
          ( cd "$W/src/libvpx" && CROSS=${TARGET}- run vpx-cfg ./configure --target=x86-win32-gcc --prefix="$PREFIX" \
              --disable-examples --disable-tools --disable-docs --disable-unit-tests --disable-install-bins --disable-install-docs \
              --disable-shared --enable-static --enable-runtime-cpu-detect --as=nasm --extra-cflags="$CF" )
          CROSS=${TARGET}- run vpx-build make -C "$W/src/libvpx" -j"$JOBS"
          CROSS=${TARGET}- run vpx-inst  make -C "$W/src/libvpx" install

          # --- FFmpeg ----------------------------------------------------------------------------------
          log "FFmpeg $BUILD_NAME ($VARIANT)"
          FFSRC="$W/src/FFmpeg"
          if [ ! -d "$FFSRC/.git" ]; then
            git clone -q --filter=blob:none --no-checkout https://github.com/sherpya/FFmpeg.git "$FFSRC"
          fi
          git -C "$FFSRC" fetch -q origin "$SHA" 2>/dev/null || true
          git -C "$FFSRC" checkout -q "$SHA"
          # O backend mbedtls so carrega CAs de um ca_file e o tls_verify vem ligado por defeito, logo
          # sem isto todos os https falham ("certificate is not correctly signed by the trusted CA").
          # Patch: se nao houver ca_file, usa cacert.pem na pasta do executavel (incluido no pacote);
          # e aceita bundles em que algum certificado nao seja interpretavel (retorno > 0).
          python3 - "$FFSRC/libavformat/tls_mbedtls.c" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, newline='').read()
          if 'cacert.pem' not in s:
              old = """    // load trusted CA\n    if (shr->ca_file) {\n        if ((ret = mbedtls_x509_crt_parse_file(&tls_ctx->ca_cert, shr->ca_file)) != 0) {"""
              new = """    // load trusted CA (XP build: por defeito, cacert.pem na pasta do executavel)
          #ifdef _WIN32
              if (!shr->ca_file) {
                  char exe_path[MAX_PATH + 16];
                  DWORD n = GetModuleFileNameA(NULL, exe_path, MAX_PATH);
                  if (n > 0 && n < MAX_PATH) {
                      char *sl = strrchr(exe_path, '\\\\');
                      if (sl) {
                          strcpy(sl + 1, "cacert.pem");
                          if (GetFileAttributesA(exe_path) != INVALID_FILE_ATTRIBUTES)
                              shr->ca_file = av_strdup(exe_path);
                      }
                  }
              }
          #endif
              if (shr->ca_file) {
                  if ((ret = mbedtls_x509_crt_parse_file(&tls_ctx->ca_cert, shr->ca_file)) < 0) {"""
              if old not in s:
                  sys.exit("ERRO: patch do tls_mbedtls.c nao aplicavel (o codigo mudou)")
              open(p, 'w', newline='').write(s.replace(old, new, 1))
              print("patch tls_mbedtls.c aplicado")
          PYEOF
          mkdir -p "$W/b-ffmpeg" && cd "$W/b-ffmpeg"
          FFOUT="$W/ffout"
          run ff-cfg "$FFSRC/configure" --prefix="$FFOUT" --target-os=mingw32 --arch=x86 --cpu="$CPU" \
            --cross-prefix=${TARGET}- --enable-cross-compile --pkg-config=pkg-config --pkg-config-flags=--static \
            --disable-autodetect --disable-doc --disable-debug --disable-w32threads --disable-bcrypt \
            --enable-gpl --enable-version3 --enable-static --disable-shared --enable-runtime-cpudetect --x86asmexe=nasm \
            --enable-zlib --enable-sdl2 --enable-libx264 --enable-libvpx --enable-libopus --enable-libvorbis \
            --enable-libmp3lame --enable-libfreetype --enable-mbedtls \
            --extra-cflags="-I$PREFIX/include $ARCH_FLAGS -DPSAPI_VERSION=1" \
            --extra-ldflags="-L$PREFIX/lib $W/xp_shim.o -static" 
          grep -E "^(threading support|bcrypt|libx264|libvpx|mbedtls|sdl2|libfreetype|libmp3lame)" "$W/logs/ff-cfg.log" || true
          # Icones e VERSIONINFO: o Makefile procura fftools/<prog>.rc relativamente ao directorio de
          # build (nao ao dos fontes), logo numa compilacao fora da arvore tem de se copiar os .rc.
          # O CPATH deixa o windres encontrar o libavutil/ffversion.h gerado neste directorio.
          mkdir -p fftools && cp "$FFSRC"/fftools/ffmpeg.rc "$FFSRC"/fftools/ffplay.rc "$FFSRC"/fftools/ffprobe.rc fftools/
          export CPATH="$W/b-ffmpeg"
          run ff-build make -j"$JOBS"
          run ff-inst  make install
          unset CPATH
          cd "$ROOT"

          # --- verificacao XP ---------------------------------------------------------------------------------
          log "Verificacao XP"
          XP_DLL_ALLOW="kernel32.dll msvcrt.dll user32.dll winmm.dll ws2_32.dll advapi32.dll shell32.dll ole32.dll oleaut32.dll gdi32.dll comctl32.dll comdlg32.dll shlwapi.dll wsock32.dll iphlpapi.dll imm32.dll version.dll setupapi.dll psapi.dll dsound.dll opengl32.dll glu32.dll avicap32.dll msvfw32.dll"
          XP_API_DENY="K32[A-Za-z]+|GetTickCount64|InitializeConditionVariable|SleepConditionVariableCS|SleepConditionVariableSRW|WakeConditionVariable|WakeAllConditionVariable|InitializeSRWLock|AcquireSRWLockExclusive|AcquireSRWLockShared|ReleaseSRWLockExclusive|ReleaseSRWLockShared|TryAcquireSRWLockExclusive|TryAcquireSRWLockShared|InitOnceExecuteOnce|InitOnceBeginInitialize|InitOnceComplete|GetSystemTimePreciseAsFileTime|CreateSymbolicLinkA|CreateSymbolicLinkW|GetFinalPathNameByHandleA|GetFinalPathNameByHandleW|WaitOnAddress|WakeByAddressSingle|WakeByAddressAll|SetThreadDescription|GetLogicalProcessorInformationEx|CreateFile2|CancelIoEx|GetThreadId|GetCurrentProcessorNumber|GetUserDefaultLocaleName|GetLocaleInfoEx|LCMapStringEx|CompareStringEx|InitializeCriticalSectionEx|CreateEventExW|CreateMutexExW|CreateSemaphoreExW|CreateWaitableTimerExW|SetFileInformationByHandle|GetFileInformationByHandleEx|QueryUnbiasedInterruptTime|RegGetValueA|RegGetValueW|inet_ntop|inet_pton|InetNtopW|InetPtonW|WSAPoll|BCrypt[A-Za-z]*|GetOverlappedResultEx|SetThreadStackGuarantee|GetThreadGroupAffinity|SetThreadGroupAffinity"
          bad=0
          for exe in ffmpeg ffprobe ffplay; do
            f="$FFOUT/bin/$exe.exe"
            dump="$(${TARGET}-objdump -p "$f")"
            echo "$exe.exe: $(printf '%s\n' "$dump" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr '\n' ' ')"
            for d in $(printf '%s\n' "$dump" | sed -n 's/^[[:space:]]*DLL Name: //p'); do
              case " $XP_DLL_ALLOW " in *" $(printf '%s' "$d" | tr 'A-Z' 'a-z') "*) ;; *) echo "  DLL fora da lista XP: $d" >&2; bad=1 ;; esac
            done
            # msvcrt.dll do XP nao exporta as funcoes "secure CRT" (_s) nem estas outras
            crt="$(printf '%s\n' "$dump" | awk '/DLL Name/ {d=tolower($3)} /^[ \t]+[0-9a-f]+[ \t]+[0-9]+[ \t]+[A-Za-z_]/ {if (d=="msvcrt.dll") print $3}' \
                  | grep -E '_s$|^rand_s$|^_set_invalid_parameter_handler$|^_configthreadlocale$|^_create_locale$|^_free_locale$|^_get_current_locale$|^_vscprintf$|^_get_errno$|^_set_errno$' || true)"
            if [ -n "$crt" ]; then echo "  funcoes do msvcrt inexistentes no XP em $exe.exe:" >&2; printf '%s\n' "$crt" >&2; bad=1; fi
            rsrc=$(printf '%s\n' "$(${TARGET}-objdump -h "$f")" | awk '$2==".rsrc" {print $3}')
            if [ -z "$rsrc" ] || [ $((16#$rsrc)) -lt 4096 ]; then echo "  $exe.exe sem icone/VERSIONINFO (.rsrc=$rsrc)" >&2; bad=1; fi
            hits="$(printf '%s\n' "$dump" | grep -E -w "$XP_API_DENY" || true)"
            if [ -n "$hits" ]; then echo "  APIs pos-XP em $exe.exe:" >&2; printf '%s\n' "$hits" >&2; bad=1; fi
          done
          [ "$bad" = 0 ] || { echo "ERRO: os exes nao passaram a verificacao XP" >&2; exit 1; }
          echo "Verificacao XP: OK (heuristica; nao substitui um teste no XP)"

          # --- empacotar ----------------------------------------------------------------------------------------------
          log "Empacotar"
          rm -rf "$OUT"; mkdir -p "$OUT/licenses"
          for exe in ffmpeg ffprobe ffplay; do cp "$FFOUT/bin/$exe.exe" "$OUT/"; ${TARGET}-strip "$OUT/$exe.exe"; done
          cp "$FFSRC"/COPYING.GPLv3 "$FFSRC"/LICENSE.md "$OUT/licenses/" 2>/dev/null || true
          # Lista de autoridades de certificacao (Mozilla, via pacote ca-certificates); o ffmpeg/ffplay/ffprobe
          # usam-na por defeito para https quando estiver na mesma pasta dos executaveis.
          cp /etc/ssl/certs/ca-certificates.crt "$OUT/cacert.pem"
          for d in libogg libvorbis opus lame mbedtls x264 libvpx freetype SDL2; do
            mkdir -p "$OUT/licenses/$d"
            find "$W/src/$d" -maxdepth 1 -type f \( -name 'COPYING*' -o -name 'LICENSE*' -o -name 'LICENCE*' -o -name 'NOTICE*' -o -name 'AUTHORS' \) -exec cp {} "$OUT/licenses/$d/" \;
          done
          {
            echo "FFmpeg (sherpya) $BUILD_NAME - build para Windows XP (32 bits), variante: $VARIANT"
            echo "Data da compilacao: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Origem: https://github.com/sherpya/FFmpeg/commit/$SHA"
            echo "Compilador: $(${TARGET}-gcc-posix --version | head -n1)"
            echo "Flags de arquitectura: $ARCH_FLAGS (--cpu=$CPU)"
            echo "https: cacert.pem (CAs da Mozilla, do pacote ca-certificates do Ubuntu) tem de ficar na pasta dos exes; ou usar -ca_file / -tls_verify 0"
            echo "Executaveis estaticos e sem simbolos (strip). Threads: pthreads (winpthreads), GetTickCount64 substituido por shim."
            echo "Bibliotecas incluidas: zlib, SDL2 release-2.32.10, x264 31e19f9, libvpx 1.15.0, opus 1.5.2, libvorbis 1.3.7, libogg 1.3.5, LAME 3.100, freetype 2.13.3, mbedtls 3.6.7"
            echo "Configuracao do FFmpeg:"; grep -E '^FFMPEG_CONFIGURATION=' "$W/b-ffmpeg/config.h" 2>/dev/null || grep -m1 '^# ' "$W/b-ffmpeg/ffbuild/config.log" | cut -c1-2000
            for exe in ffmpeg ffprobe ffplay; do echo "$exe.exe  $(stat -c %s "$OUT/$exe.exe") bytes  sha256 $(sha256sum "$OUT/$exe.exe" | cut -d' ' -f1)"; done
          } > "$OUT/BUILD-INFO.txt"
          echo "Pronto: $OUT"

      - name: Criar zip
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_NAME: ${{ needs.prepare.outputs.name }}
        run: |
          cd "build/release/xp_${VARIANT}"
          zip -q -r -9 "../ffmpeg-${BUILD_NAME}-xp_${VARIANT}.zip" .
          ls -la ..

      - name: Guardar pacote
        uses: actions/upload-artifact@v4
        with:
          name: xp_${{ matrix.variant }}
          path: build/release/*.zip
          if-no-files-found: error

      - name: Guardar logs (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs_${{ matrix.variant }}
          path: work/logs
          if-no-files-found: ignore

  release:
    name: Publicar release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xp_*
          path: dist
          merge-multiple: true

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          set -euo pipefail
          gh api "repos/$UPSTREAM/commits/$SHA" > c.json
          fix() { sed -E "s@(^|[^A-Za-z0-9/&])#([0-9]+)@\1${UPSTREAM}#\2@g"; }
          subject=$(jq -r '.commit.message | split("\n")[0]' c.json | fix)
          jq -r '.commit.message' c.json | sed '1,2d' | fix > msgbody.md
          author=$(jq -r '.commit.author.name' c.json)
          adate=$(jq -r '.commit.author.date' c.json)
          cdate=$(jq -r '.commit.committer.date' c.json)
          url=$(jq -r '.html_url' c.json)
          desc=$(gh api "repos/$UPSTREAM" --jq '.description // ""')
          gh api "repos/$UPSTREAM/commits?sha=$SHA&per_page=15" \
            --jq '.[] | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"' | fix > recent.md

          {
            echo "> **Build nao oficial para Windows XP (32 bits)** do commit [\`${SHA:0:7}\`](${url}) de \`${UPSTREAM}\` (\`${BRANCH}\`, sempre rebaseado)."
            echo "> Autor: ${author} em ${adate} (commit em ${cdate})."
            [ -z "$desc" ] || echo "> Repositorio original: ${desc}"
            echo ">"
            echo "> | Ficheiro | Optimizacao |"
            echo "> |---|---|"
            echo "> | \`ffmpeg-${NAME}-xp_prescott.zip\` | Pentium 4 Prescott (\`-march=prescott\`, SSE3) |"
            echo "> | \`ffmpeg-${NAME}-xp_generic.zip\` | generica (\`-march=i686\`, sem SSE) |"
            echo ">"
            echo "> ffmpeg, ffprobe e ffplay estaticos e sem simbolos. Incluidos: x264, libvpx, opus, vorbis, LAME, freetype, SDL2, mbedtls (TLS), zlib."
            echo ""
            echo "---"
            echo ""
            echo "### ${subject}"
            echo ""
            cat msgbody.md
            echo ""
            echo "### Ultimos commits do master"
            echo ""
            cat recent.md
          } > notes.md

          (cd dist && sha256sum ./*.zip | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS)

          # Se ja existir release para este commit (nova execucao), substitui-a
          gh release delete "$NAME" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$NAME" dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "${NAME} - ${subject}" \
            --notes-file notes.md
