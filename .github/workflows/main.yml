name: FFmpeg XP (Sherpya)

# Compila o sherpya/ffmpeg (ffmpeg.exe, ffplay.exe, ffprobe.exe) para Windows XP (32 bits),
# optimizado para Pentium 4 HT Prescott (SSE3), sempre que o repositorio original
# recebe novos commits na branch principal.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit/branch/tag upstream a compilar (vazio = ultimo commit)"
        required: false
        default: ""
      force:
        description: "Recompilar mesmo que a release ja exista (substitui-a)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ffmpeg-xp
  cancel-in-progress: false

env:
  UPSTREAM: sherpya/ffmpeg
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Verificar commits upstream
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.up.outputs.tag }}
      sha: ${{ steps.up.outputs.sha }}
      build: ${{ steps.up.outputs.build }}
    steps:
      - id: up
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT: ${{ inputs.commit }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_COMMIT" ]; then
            [[ "$INPUT_COMMIT" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::referencia invalida: $INPUT_COMMIT"; exit 1; }
            ref="$INPUT_COMMIT"
          else
            ref=$(gh api "repos/$UPSTREAM" --jq '.default_branch')
          fi

          commit_json=$(gh api "repos/$UPSTREAM/commits/$ref") \
            || { echo "::error::Nao foi possivel obter o commit '$ref' em $UPSTREAM"; exit 1; }

          sha=$(echo "$commit_json" | jq -r '.sha')
          short_sha="${sha:0:7}"
          commit_date=$(echo "$commit_json" | jq -r '.commit.committer.date' | cut -dT -f1 | tr -d '-')
          tag="git-${commit_date}-${short_sha}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            build=false
            echo "Release $tag ($sha) ja existe em $GITHUB_REPOSITORY; nada a fazer."
          else
            build=true
            echo "A compilar $tag (commit $sha)."
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Compilar (${{ matrix.variant }})
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        variant: [prescott] # "generic" desactivada temporariamente (basta acrescentar aqui)
    steps:
      - name: Instalar toolchain MinGW-w64 (threads win32)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686-win32 g++-mingw-w64-i686-win32 binutils-mingw-w64-i686 \
            mingw-w64-i686-dev nasm yasm pkg-config make autoconf automake libtool \
            git curl ca-certificates xz-utils bzip2 zip jq
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-win32 || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-win32 || true
          i686-w64-mingw32-gcc -v 2>&1 | tail -n 3

      - name: Compilar dependencias estaticas e FFmpeg
        env:
          TAG: ${{ needs.check.outputs.tag }}
          COMMIT_SHA: ${{ needs.check.outputs.sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          WORKDIR="$GITHUB_WORKSPACE/build"
          SRC="$WORKDIR/src"
          PREFIX="$WORKDIR/prefix"
          LOGS="$WORKDIR/logs"
          REL="$WORKDIR/release"
          mkdir -p "$SRC" "$PREFIX/include" "$PREFIX/lib/pkgconfig" "$PREFIX/bin" "$LOGS" "$REL"

          # run <nome-do-log> <comando...> : em caso de erro mostra o fim do log desse passo
          run() {
            local n="$1"; shift
            if ! "$@" >>"$LOGS/$n.log" 2>&1; then
              echo "::error::Falhou [$n]: $*"
              echo "-------- ultimas 150 linhas de $n.log --------"
              tail -n 150 "$LOGS/$n.log"
              exit 1
            fi
          }

          # fetch <url> : descarrega (com retry) para ficheiro e extrai no directorio actual
          fetch() {
            local f
            f=$(mktemp -p "$SRC")
            curl -fsSL --retry 5 --retry-delay 3 -o "$f" "$1" \
              || { echo "::error::Download falhou: $1"; exit 1; }
            tar -xf "$f"
            rm -f "$f"
          }

          export PATH="$PREFIX/bin:$PATH"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          JOBS=$(nproc)

          # ---- Alvo: Windows XP SP3 (NT 5.1) ----
          XP_CPPFLAGS="-D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -DNDEBUG"
          XP_LDFLAGS="-Wl,--major-os-version=5 -Wl,--minor-os-version=1 -Wl,--major-subsystem-version=5 -Wl,--minor-subsystem-version=1 -Wl,--gc-sections"

          if [ "$VARIANT" = "prescott" ]; then
            # P4 Prescott (NetBurst): -O2 (e nao -O3) para nao inchar a trace cache;
            # SSE em vez de x87; -mstackrealign porque as threads do Windows 32-bit
            # comecam com stack alinhada a 4 bytes e o GCC assume 16 com SSE.
            CPU_FLAGS="-O2 -ftree-vectorize -march=prescott -mtune=prescott -mfpmath=sse -mstackrealign -fomit-frame-pointer -fno-stack-protector -ffunction-sections -fdata-sections"
            FF_CPU="prescott"
          else
            CPU_FLAGS="-O2 -march=i686 -mtune=generic -fomit-frame-pointer -fno-stack-protector -ffunction-sections -fdata-sections"
            FF_CPU="i686"
          fi

          export CFLAGS="$CPU_FLAGS $XP_CPPFLAGS"
          export CXXFLAGS="$CPU_FLAGS $XP_CPPFLAGS"
          export CPPFLAGS="$XP_CPPFLAGS -I$PREFIX/include"
          export LDFLAGS="$XP_LDFLAGS -L$PREFIX/lib"

          HOST=i686-w64-mingw32

          echo "=== [1/10] zlib ==="
          cd "$SRC"; fetch https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz
          cd zlib-1.3.1
          run zlib make -f win32/Makefile.gcc PREFIX=$HOST- CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" -j"$JOBS"
          run zlib make -f win32/Makefile.gcc install BINARY_PATH="$PREFIX/bin" INCLUDE_PATH="$PREFIX/include" LIBRARY_PATH="$PREFIX/lib" SHARED_MODE=0

          echo "=== [2/10] bzip2 ==="
          cd "$SRC"; fetch https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          cd bzip2-1.0.8
          run bzip2 make CC=$HOST-gcc AR=$HOST-ar RANLIB=$HOST-ranlib CFLAGS="$CFLAGS -D_FILE_OFFSET_BITS=64" libbz2.a
          cp -f bzlib.h "$PREFIX/include/"
          cp -f libbz2.a "$PREFIX/lib/"

          echo "=== [3/10] xz / liblzma ==="
          cd "$SRC"; fetch https://github.com/tukaani-project/xz/releases/download/v5.4.7/xz-5.4.7.tar.xz
          cd xz-5.4.7
          run xz ./configure --host=$HOST --prefix="$PREFIX" --enable-static --disable-shared \
            --enable-threads=win95 --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo \
            --disable-scripts --disable-doc
          run xz make -j"$JOBS"
          run xz make install

          echo "=== [4/10] libiconv ==="
          cd "$SRC"; fetch https://ftp.gnu.org/gnu/libiconv/libiconv-1.17.tar.gz
          cd libiconv-1.17
          run iconv ./configure --host=$HOST --prefix="$PREFIX" --enable-static --disable-shared --disable-nls
          run iconv make -j"$JOBS"
          run iconv make install

          echo "=== [5/10] mbedtls 2.28 (HTTPS/TLS 1.2, usa CryptGenRandom => OK no XP) ==="
          cd "$SRC"; fetch https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v2.28.8.tar.gz
          cd mbedtls-2.28.8
          run mbedtls make CC=$HOST-gcc AR=$HOST-ar WINDOWS=1 CFLAGS="$CFLAGS" lib -j"$JOBS"
          cp -r include/mbedtls include/psa "$PREFIX/include/"
          cp library/*.a "$PREFIX/lib/"
          printf '%s\n' \
            "prefix=$PREFIX" \
            'exec_prefix=${prefix}' \
            'libdir=${exec_prefix}/lib' \
            'includedir=${prefix}/include' \
            'Name: mbedtls' \
            'Description: Mbed TLS' \
            'Version: 2.28.8' \
            'Libs: -L${libdir} -lmbedtls -lmbedx509 -lmbedcrypto -lws2_32 -ladvapi32' \
            'Cflags: -I${includedir}' \
            > "$PREFIX/lib/pkgconfig/mbedtls.pc"

          echo "=== [6/10] SDL2 (para o ffplay) ==="
          cd "$SRC"; fetch https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
          cd SDL2-2.28.5
          run sdl2 ./configure --host=$HOST --prefix="$PREFIX" --enable-static --disable-shared \
            --disable-sensor --disable-hidapi --disable-power --disable-haptic
          run sdl2 make -j"$JOBS"
          run sdl2 make install

          echo "=== [7/10] libogg + libvorbis ==="
          cd "$SRC"; fetch https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.xz
          cd libogg-1.3.5
          run ogg ./configure --host=$HOST --prefix="$PREFIX" --enable-static --disable-shared
          run ogg make -j"$JOBS"
          run ogg make install

          cd "$SRC"; fetch https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz
          cd libvorbis-1.3.7
          run vorbis ./configure --host=$HOST --prefix="$PREFIX" --enable-static --disable-shared --disable-oggtest
          run vorbis make -j"$JOBS"
          run vorbis make install

          echo "=== [8/10] libopus ==="
          cd "$SRC"; fetch https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
          cd opus-1.5.2
          run opus ./configure --host=$HOST --prefix="$PREFIX" --enable-static --disable-shared \
            --disable-doc --disable-extra-programs
          run opus make -j"$JOBS"
          run opus make install

          echo "=== [9/10] libmp3lame ==="
          cd "$SRC"; fetch https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          cd lame-3.100
          run lame ./configure --host=$HOST --prefix="$PREFIX" --enable-static --disable-shared \
            --enable-nasm --disable-frontend --disable-decoder
          run lame make -j"$JOBS"
          run lame make install

          echo "=== [10/10] x264 ==="
          cd "$SRC"
          run x264 git clone --depth 1 --branch stable https://code.videolan.org/videolan/x264.git
          cd x264
          # o configure do x264 le CFLAGS/LDFLAGS do ambiente
          run x264 ./configure --host=$HOST --cross-prefix=$HOST- --prefix="$PREFIX" \
            --enable-static --enable-strip --enable-win32thread --disable-cli --disable-swscale --disable-lavf
          run x264 make -j"$JOBS"
          run x264 make install

          echo "=== FFmpeg: $UPSTREAM @ $COMMIT_SHA ==="
          mkdir -p "$SRC/ffmpeg"
          cd "$SRC/ffmpeg"
          run ffmpeg_git git init
          run ffmpeg_git git remote add origin "https://github.com/$UPSTREAM.git"
          run ffmpeg_git git fetch --depth 1 origin "$COMMIT_SHA"
          run ffmpeg_git git checkout FETCH_HEAD

          # Flags opcionais: so as que esta revisao do configure conhece.
          # (o help vai para variavel: "configure --help | grep -q" + pipefail daria SIGPIPE/falso negativo)
          FF_HELP=$(./configure --help)
          OPT_FLAGS=()
          for opt in --disable-bcrypt --disable-mediafoundation --disable-d3d11va --disable-d3d12va \
                     --disable-dxva2 --disable-vulkan --disable-schannel; do
            if grep -qF -- "$opt" <<<"$FF_HELP"; then OPT_FLAGS+=("$opt"); fi
          done
          echo "Flags opcionais aceites: ${OPT_FLAGS[*]:-nenhuma}"

          FF_ARGS=(
            --prefix="$PREFIX"
            --arch=x86_32
            --cpu="$FF_CPU"
            --target-os=mingw32
            --cross-prefix=$HOST-
            --pkg-config=pkg-config
            --pkg-config-flags="--static"
            --optflags="$CPU_FLAGS"
            --extra-cflags="$XP_CPPFLAGS -I$PREFIX/include"
            --extra-ldflags="$XP_LDFLAGS -L$PREFIX/lib -static -static-libgcc"
            --extra-libs="-lws2_32 -lwinmm -lgdi32 -lole32 -loleaut32 -limm32 -lversion -luuid -ladvapi32 -lshell32 -lsetupapi -lm"
            --enable-static --disable-shared
            --enable-gpl --enable-version3
            --enable-w32threads --disable-pthreads
            --enable-runtime-cpudetect
            --enable-ffmpeg --enable-ffplay --enable-ffprobe
            --disable-doc --disable-debug --enable-stripping
            --enable-zlib --enable-bzlib --enable-lzma --enable-iconv
            --enable-sdl2
            --enable-libmp3lame --enable-libvorbis --enable-libopus --enable-libx264
            "${OPT_FLAGS[@]}"
          )

          TLS=mbedtls
          if ! ./configure "${FF_ARGS[@]}" --enable-mbedtls >"$LOGS/ffmpeg_configure.log" 2>&1; then
            echo "::warning::configure com mbedtls falhou; a repetir SEM HTTPS/TLS"
            tail -n 40 "$LOGS/ffmpeg_configure.log" || true
            cp ffbuild/config.log "$LOGS/config_mbedtls.log" 2>/dev/null || true
            tail -n 60 ffbuild/config.log 2>/dev/null || true
            TLS=none
            if ! ./configure "${FF_ARGS[@]}" >"$LOGS/ffmpeg_configure.log" 2>&1; then
              echo "::error::configure do FFmpeg falhou"
              tail -n 60 "$LOGS/ffmpeg_configure.log"
              cp ffbuild/config.log "$LOGS/config.log" 2>/dev/null || true
              tail -n 150 ffbuild/config.log 2>/dev/null || true
              exit 1
            fi
          fi
          sed -n '/External libraries:/,/^$/p' "$LOGS/ffmpeg_configure.log" || true
          grep -n "WIN32_WINNT" config.h ffbuild/config.mak || true

          run ffmpeg_build make -j"$JOBS"

          # ---- Empacotar + validar compatibilidade XP ----
          PKGNAME="ffmpeg-${TAG}-xp_${VARIANT}"
          STAGE="$WORKDIR/package/$PKGNAME"
          mkdir -p "$STAGE"

          BAD_DLL='^(bcrypt|ncrypt|mfplat|d3d11|d3d12|dxva2|api-ms-win|ucrtbase|vcruntime|libwinpthread|libssp|libgcc|libstdc\+\+)'
          VISTA_API='InitializeSRWLock|AcquireSRWLock|ReleaseSRWLock|TryAcquireSRWLock|InitializeConditionVariable|SleepConditionVariable|WakeConditionVariable|WakeAllConditionVariable|InitOnceExecuteOnce|InitOnceBeginInitialize|InitOnceComplete|GetTickCount64|WSAPoll|inet_pton|inet_ntop|InetPton|GetFileInformationByHandleEx|SetFileInformationByHandle|GetFinalPathNameByHandle|CreateSymbolicLink|CancelSynchronousIo|QueryThreadCycleTime|GetLogicalProcessorInformationEx|CompareStringEx|GetUserDefaultLocaleName|LocaleNameToLCID|SetThreadStackGuarantee|GetSystemTimePreciseAsFileTime|CreateWaitableTimerEx|CreateEventEx|CreateSemaphoreEx|CreateMutexEx|BCrypt'

          fail=0
          for bin in ffmpeg.exe ffplay.exe ffprobe.exe; do
            if [ ! -f "$bin" ]; then
              echo "::error::$bin nao foi gerado!"; exit 1
            fi
            $HOST-strip --strip-all "$bin" -o "$STAGE/$bin"

            dump=$($HOST-objdump -p "$STAGE/$bin")
            echo "---- $bin ($(du -h "$STAGE/$bin" | cut -f1)) ----"
            echo "$dump" | awk '/DLL Name:/{print "  DLL: " $3}'
            echo "$dump" | grep -E 'MajorSubsystemVersion|MinorSubsystemVersion|MajorOSystemVersion|MinorOSystemVersion'

            if echo "$dump" | awk '/DLL Name:/{print $3}' | grep -Eiq "$BAD_DLL"; then
              echo "::error::$bin importa DLL incompativel com XP / nao-estatica"; fail=1
            fi
            if echo "$dump" | grep -E "[[:space:]]($VISTA_API)"; then
              echo "::error::$bin importa funcoes Vista+ (listadas acima) - o fork/configure nao ficou 100% XP"; fail=1
            fi
            maj=$(echo "$dump" | awk '/MajorSubsystemVersion/{print $2}')
            min=$(echo "$dump" | awk '/MinorSubsystemVersion/{print $2}')
            if [ "$maj" != "5" ] || [ "$min" != "1" ]; then
              echo "::error::$bin com subsystem $maj.$min (esperado 5.1)"; fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1

          cp -f COPYING* LICENSE* README* "$STAGE/" 2>/dev/null || true
          {
            echo "Upstream : $UPSTREAM @ $COMMIT_SHA"
            echo "Tag      : $TAG"
            echo "Variante : $VARIANT  (--cpu=$FF_CPU)"
            echo "TLS/HTTPS: $TLS"
            echo "CFLAGS   : $CPU_FLAGS $XP_CPPFLAGS"
            echo "GCC      : $($HOST-gcc --version | head -n1)"
            echo
            grep FFMPEG_CONFIGURATION config.h || true
          } > "$STAGE/BUILD-INFO.txt"

          (cd "$WORKDIR/package" && zip -9 -r "$REL/$PKGNAME.zip" "$PKGNAME")
          ls -l "$REL"

      - name: Guardar pacote
        uses: actions/upload-artifact@v4
        with:
          name: xp_${{ matrix.variant }}
          path: build/release/*.zip
          if-no-files-found: error

      - name: Guardar logs (falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs_${{ matrix.variant }}
          path: build/logs
          if-no-files-found: ignore

  release:
    name: Publicar release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xp_*
          path: dist
          merge-multiple: true

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          gh api "repos/$UPSTREAM/commits/$SHA" > up.json
          url=$(jq -r '.html_url' up.json)
          published=$(jq -r '.commit.committer.date' up.json)
          author=$(jq -r '.author.login // .commit.author.name // "desconhecido"' up.json)
          short_sha="${SHA:0:7}"

          jq -r '.commit.message // ""' up.json \
            | sed -E "s@(^|[^A-Za-z0-9/&])#([0-9]+)@\1${UPSTREAM}#\2@g" > body.md

          {
            echo "> **Build nao oficial para Windows XP (32 bits)** do commit [\`${short_sha}\`](${url}) de \`${UPSTREAM}\`."
            echo "> Data do commit original: ${published} por **${author}**."
            echo ">"
            echo "> | Ficheiro | Optimizacao |"
            echo "> |---|---|"
            echo "> | \`ffmpeg-${TAG}-xp_prescott.zip\` | Pentium 4 Prescott (\`-O2 -march=prescott -mtune=prescott -mfpmath=sse\`, SSE3) |"
            echo ">"
            echo "> **Inclui:** \`ffmpeg.exe\`, \`ffplay.exe\` e \`ffprobe.exe\` (estaticos, stripped, subsystem 5.1)."
            echo "> **Bibliotecas:** SDL2, x264, LAME MP3, Opus, Vorbis, zlib, bzip2, lzma, iconv e mbedTLS (HTTPS; ver \`BUILD-INFO.txt\` no zip). Licenca GPLv3."
            echo ""
            echo "---"
            echo "### Mensagem do commit upstream"
            echo ""
            cat body.md
          } > notes.md

          (cd dist && sha256sum ./*.zip | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS)

          if [ "${FORCE:-}" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          fi

          default_branch=$(gh api "repos/$UPSTREAM" --jq '.default_branch')
          latest_sha=$(gh api "repos/$UPSTREAM/commits/$default_branch" --jq '.sha')
          if [ "$SHA" = "$latest_sha" ]; then latest=true; else latest=false; fi

          gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg XP ${TAG}" \
            --notes-file notes.md \
            --latest="$latest"
