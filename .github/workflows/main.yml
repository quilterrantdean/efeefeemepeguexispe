- name: Configurar e Compilar
        id: compile
        run: |
          set -euo pipefail
          cd ffmpeg

          TARGET_CPU="${{ matrix.variant }}"
          COMMON_CFLAGS="-O3 -fomit-frame-pointer -DWINVER=0x0501 -D_WIN32_WINNT=0x0501"

          if [ "$TARGET_CPU" = "prescott" ]; then
            CPU_FLAG="--cpu=prescott"
            OPT_CFLAGS="${COMMON_CFLAGS} -march=prescott -mtune=prescott -mfpmath=sse"
          else
            CPU_FLAG="--cpu=i686"
            OPT_CFLAGS="${COMMON_CFLAGS} -march=i686 -mtune=generic"
          fi

          export PKG_CONFIG_PATH="/usr/i686-w64-mingw32/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="/usr/i686-w64-mingw32/lib/pkgconfig"

          ./configure \
            --prefix=./dist \
            --cross-prefix=i686-w64-mingw32- \
            --target-os=mingw32 \
            --arch=x86 \
            ${CPU_FLAG} \
            --extra-version="sherpya-xp" \
            --enable-gpl \
            --enable-version3 \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-bcrypt \
            --disable-mediafoundation \
            --disable-w32threads \
            --enable-pthreads \
            --enable-hardcoded-tables \
            --enable-sdl2 \
            --enable-ffplay \
            --extra-cflags="${OPT_CFLAGS}" \
            --extra-ldflags="-static -Wl,--subsystem,console:5.01"

          make -j$(nproc)

          # Reducao estrita de tamanho (remover tabelas de simbolos)
          i686-w64-mingw32-strip -s --strip-all ffmpeg.exe ffprobe.exe ffplay.exe

          mkdir -p ../out
          cp ffmpeg.exe ffprobe.exe ffplay.exe ../out/
          cp /usr/i686-w64-mingw32/bin/SDL2.dll ../out/
