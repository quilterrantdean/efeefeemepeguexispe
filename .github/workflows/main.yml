name: FFmpeg XP (Sherpya)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit/branch/tag do sherpya/ffmpeg (vazio = ultimo commit do branch por defeito)"
        required: false
        default: ""
        type: string
      force:
        description: "Recompilar mesmo que a release ja exista"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ffmpeg-xp
  cancel-in-progress: false

env:
  UPSTREAM: sherpya/ffmpeg
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: FFmpeg XP
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ROOT: ${{ github.workspace }}/build
      HOST: i686-w64-mingw32
      # prescott = otimizado para Pentium 4 Prescott | generic = qualquer CPU i686
      VARIANT: prescott
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # ------------------------------------------------------------------
      # 1) VERIFICAR
      # ------------------------------------------------------------------
      - name: "1) Verificar se ha commit novo"
        id: check
        shell: bash
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$UPSTREAM" --jq .default_branch)"
          ref="${INPUT_COMMIT:-}"
          if [ -z "$ref" ]; then ref="$default_branch"; fi
          if ! [[ "$ref" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Valor invalido em 'commit': $ref"
            exit 1
          fi
          info="$(gh api "repos/$UPSTREAM/commits/$ref")"
          sha="$(jq -r .sha <<<"$info")"
          cdate="$(jq -r .commit.committer.date <<<"$info")"
          head_sha="$(gh api "repos/$UPSTREAM/commits/$default_branch" --jq .sha)"
          day="$(date -u -d "$cdate" +%Y%m%d)"
          tag="git-${day}-${sha:0:7}"

          build=true
          if [ "${INPUT_FORCE:-false}" != "true" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
          fi

          echo "Upstream ref : $ref"
          echo "Commit       : $sha"
          echo "Tag          : $tag"
          echo "Compilar     : $build"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "head=$head_sha"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - name: "Nada a fazer"
        if: steps.check.outputs.build != 'true'
        run: |
          echo "::notice::A release ${{ steps.check.outputs.tag }} ja existe. Usa 'force' para recompilar."

      # ------------------------------------------------------------------
      # 2) FERRAMENTAS
      # ------------------------------------------------------------------
      - name: "2) Instalar ferramentas"
        if: steps.check.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686-win32 g++-mingw-w64-i686-win32 \
            binutils-mingw-w64-i686 mingw-w64-i686-dev \
            nasm yasm pkg-config make autoconf automake libtool \
            git curl ca-certificates xz-utils bzip2 zip jq python3
          sudo update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-win32 || true
          sudo update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-win32 || true
          i686-w64-mingw32-gcc --version | sed -n 1p
          nasm -v

      # ------------------------------------------------------------------
      # 3) COMPILAR
      # ------------------------------------------------------------------
      - name: "3) Compilar dependencias e FFmpeg"
        if: steps.check.outputs.build == 'true'
        shell: bash
        env:
          TAG: ${{ steps.check.outputs.tag }}
          COMMIT_SHA: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          SRC="$ROOT/src"
          PREFIX="$ROOT/prefix"
          LOGS="$ROOT/logs"
          META="$ROOT/meta"
          JOBS="$(nproc)"
          mkdir -p "$SRC" "$PREFIX/lib/pkgconfig" "$PREFIX/include" "$PREFIX/bin" "$LOGS" "$META"

          # ---------------- helpers ----------------
          show_fail() {
            local name="$1"
            echo "::error::Falhou: $name"
            echo "---- linhas relevantes de $name ----"
            grep -E 'error:|Error [0-9]+|undefined reference|No such file|\*\*\*' "$LOGS/$name.log" 2>/dev/null | head -n 60 || true
            echo "---- fim ----"
          }

          # corre um comando, mostra o output na consola e guarda no log
          run() {
            local name="$1"; shift
            local rc
            set +e
            "$@" 2>&1 | tee -a "$LOGS/$name.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 0 ] && [ "${RUN_QUIET:-0}" != "1" ]; then
              show_fail "$name"
            fi
            return "$rc"
          }

          fetch() {
            local url="$1" f="$ROOT/dl.tmp"
            rm -f "$f"
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors -sS -o "$f" "$url" || return 1
            tar -xf "$f" -C "$SRC" || return 1
            rm -f "$f"
          }

          # ---------------- flags ----------------
          XP_CPPFLAGS="-D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -DNDEBUG"
          FF_CPPFLAGS="-U_WIN32_WINNT -UWINVER -D_WIN32_WINNT=0x0501 -DWINVER=0x0501 -DNDEBUG"
          XP_LDFLAGS="-Wl,--major-os-version=5 -Wl,--minor-os-version=1 -Wl,--major-subsystem-version=5 -Wl,--minor-subsystem-version=1 -Wl,--gc-sections"

          case "$VARIANT" in
            prescott)
              CPU_FLAGS="-O2 -ftree-vectorize -march=prescott -mtune=prescott -mfpmath=sse -mstackrealign -fomit-frame-pointer -fno-stack-protector -ffunction-sections -fdata-sections"
              FF_CPU=prescott
              ;;
            generic)
              CPU_FLAGS="-O2 -march=i686 -mtune=generic -mstackrealign -fomit-frame-pointer -fno-stack-protector -ffunction-sections -fdata-sections"
              FF_CPU=i686
              ;;
            *)
              echo "::error::VARIANT invalida: $VARIANT"
              exit 1
              ;;
          esac
          echo "$CPU_FLAGS" > "$META/cpu_flags"
          echo "Variante: $VARIANT"
          echo "CFLAGS  : $CPU_FLAGS"

          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export CC="${HOST}-gcc" CXX="${HOST}-g++" AR="${HOST}-ar" RANLIB="${HOST}-ranlib"
          export STRIP="${HOST}-strip" WINDRES="${HOST}-windres" DLLTOOL="${HOST}-dlltool"
          export CPPFLAGS="$XP_CPPFLAGS -I$PREFIX/include"
          export CFLAGS="$CPU_FLAGS" CXXFLAGS="$CPU_FLAGS"
          export LDFLAGS="-L$PREFIX/lib"

          # ======================================================
          # Dependencias (todas estaticas)
          # ======================================================
          echo "::group::zlib 1.3.1"
          fetch https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.xz
          cd "$SRC/zlib-1.3.1"
          run zlib make -f win32/Makefile.gcc PREFIX="${HOST}-" SHARED_MODE=0 \
            LOC="$CPPFLAGS $CFLAGS" \
            BINARY_PATH="$PREFIX/bin" INCLUDE_PATH="$PREFIX/include" LIBRARY_PATH="$PREFIX/lib" install
          echo "::endgroup::"

          echo "::group::bzip2 1.0.8"
          fetch https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          cd "$SRC/bzip2-1.0.8"
          run bzip2 make libbz2.a CC="$CC" AR="$AR" RANLIB="$RANLIB" CFLAGS="$CPPFLAGS $CFLAGS -D_FILE_OFFSET_BITS=64"
          cp bzlib.h "$PREFIX/include/"
          cp libbz2.a "$PREFIX/lib/"
          echo "::endgroup::"

          echo "::group::xz 5.4.7"
          fetch https://github.com/tukaani-project/xz/releases/download/v5.4.7/xz-5.4.7.tar.xz
          cd "$SRC/xz-5.4.7"
          run xz ./configure --host="$HOST" --prefix="$PREFIX" --disable-shared --enable-static \
            --disable-xz --disable-xzdec --disable-lzmadec --disable-lzmainfo \
            --disable-scripts --disable-doc --disable-nls --enable-threads=win95
          run xz make -j"$JOBS"
          run xz make install
          echo "::endgroup::"

          echo "::group::libiconv 1.17"
          fetch https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.17.tar.gz
          cd "$SRC/libiconv-1.17"
          run iconv ./configure --host="$HOST" --prefix="$PREFIX" --disable-shared --enable-static --disable-nls
          run iconv make -j"$JOBS"
          run iconv make install
          echo "::endgroup::"

          # ---- mbedtls 3.6.3 (opcional: se falhar, compila-se sem TLS) ----
          TLS_OK=0
          build_mbedtls() {
            fetch https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.3/mbedtls-3.6.3.tar.bz2 || return 1
            cd "$SRC/mbedtls-3.6.3" || return 1
            # BCryptGenRandom nao existe no XP: entropia propria via CryptGenRandom
            python3 scripts/config.py set MBEDTLS_NO_PLATFORM_ENTROPY || return 1
            python3 scripts/config.py set MBEDTLS_ENTROPY_HARDWARE_ALT || return 1
            cat > "$ROOT/mbedtls_hw_poll.c" <<'HWC'
          #include <windows.h>
          #include <wincrypt.h>
          #include <stddef.h>

          int mbedtls_hardware_poll(void *data, unsigned char *output, size_t len, size_t *olen)
          {
              HCRYPTPROV prov;
              (void)data;
              *olen = 0;
              if (!CryptAcquireContextA(&prov, NULL, NULL, PROV_RSA_FULL,
                                        CRYPT_VERIFYCONTEXT | CRYPT_SILENT))
                  return -0x003C;
              while (len > 0) {
                  DWORD c = len > 65536 ? 65536 : (DWORD)len;
                  if (!CryptGenRandom(prov, c, output)) {
                      CryptReleaseContext(prov, 0);
                      return -0x003C;
                  }
                  output += c;
                  len -= c;
                  *olen += c;
              }
              CryptReleaseContext(prov, 0);
              return 0;
          }
          HWC
            run mbedtls make lib WINDOWS=1 CC="$CC" AR="$AR" CFLAGS="$CPPFLAGS $CFLAGS" -j"$JOBS" || return 1
            run mbedtls "$CC" $CPPFLAGS $CFLAGS -c "$ROOT/mbedtls_hw_poll.c" -o "$ROOT/mbedtls_hw_poll.o" || return 1
            "$AR" rcs library/libmbedcrypto.a "$ROOT/mbedtls_hw_poll.o" || return 1
            cp -r include/mbedtls include/psa "$PREFIX/include/" || return 1
            cp library/libmbedtls.a library/libmbedx509.a library/libmbedcrypto.a "$PREFIX/lib/" || return 1
            cat > "$PREFIX/lib/pkgconfig/mbedtls.pc" <<MBPC
          prefix=$PREFIX
          Name: mbedtls
          Description: mbed TLS
          Version: 3.6.3
          Libs: -L$PREFIX/lib -lmbedtls -lmbedx509 -lmbedcrypto -lws2_32 -ladvapi32
          Cflags: -I$PREFIX/include
          MBPC
          }
          echo "::group::mbedtls 3.6.3"
          if build_mbedtls; then
            TLS_OK=1
          else
            echo "::warning::mbedtls falhou; o FFmpeg sera compilado SEM TLS (sem https)."
          fi
          echo "::endgroup::"
          cd "$ROOT"

          echo "::group::SDL2 2.28.5"
          fetch https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
          cd "$SRC/SDL2-2.28.5"
          run sdl2 ./configure --host="$HOST" --prefix="$PREFIX" --disable-shared --enable-static \
            --disable-sensor --disable-hidapi --disable-power --disable-haptic
          run sdl2 make -j"$JOBS"
          run sdl2 make install
          echo "::endgroup::"

          echo "::group::libogg 1.3.5"
          fetch https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.xz
          cd "$SRC/libogg-1.3.5"
          run ogg ./configure --host="$HOST" --prefix="$PREFIX" --disable-shared --enable-static
          run ogg make -j"$JOBS"
          run ogg make install
          echo "::endgroup::"

          echo "::group::libvorbis 1.3.7"
          fetch https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz
          cd "$SRC/libvorbis-1.3.7"
          run vorbis ./configure --host="$HOST" --prefix="$PREFIX" --disable-shared --enable-static \
            --disable-oggtest --disable-examples --disable-docs
          run vorbis make -j"$JOBS"
          run vorbis make install
          echo "::endgroup::"

          echo "::group::opus 1.5.2"
          fetch https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
          cd "$SRC/opus-1.5.2"
          run opus ./configure --host="$HOST" --prefix="$PREFIX" --disable-shared --enable-static \
            --disable-doc --disable-extra-programs
          run opus make -j"$JOBS"
          run opus make install
          echo "::endgroup::"

          echo "::group::lame 3.100"
          fetch https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          cd "$SRC/lame-3.100"
          run lame ./configure --host="$HOST" --prefix="$PREFIX" --disable-shared --enable-static \
            --enable-nasm --disable-frontend --disable-decoder
          run lame make -j"$JOBS"
          run lame make install
          echo "::endgroup::"

          echo "::group::x264 (stable)"
          run x264 git clone --depth 1 --branch stable https://code.videolan.org/videolan/x264.git "$SRC/x264"
          cd "$SRC/x264"
          run x264 ./configure --host="$HOST" --cross-prefix="${HOST}-" --prefix="$PREFIX" \
            --enable-static --enable-strip --enable-win32thread --disable-cli --disable-swscale \
            --disable-lavf --disable-ffms --disable-gpac --disable-lsmash --disable-opencl
          run x264 make -j"$JOBS"
          run x264 make install
          echo "::endgroup::"

          # ======================================================
          # FFmpeg (sherpya)
          # ======================================================
          unset CC CXX AR RANLIB STRIP WINDRES DLLTOOL CPPFLAGS CFLAGS CXXFLAGS LDFLAGS

          echo "::group::Obter codigo do FFmpeg"
          mkdir -p "$SRC/ffmpeg"
          cd "$SRC/ffmpeg"
          git init -q .
          git remote add origin "https://github.com/$UPSTREAM.git"
          git fetch --depth 1 origin "$COMMIT_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H%n%an%n%ad%n%s'
          echo "::endgroup::"

          # ---------- Patch XP 1: WC_ERR_INVALID_CHARS (Vista+) ----------
          echo "::group::Patch XP 1 (WC_ERR_INVALID_CHARS)"
          files="$(grep -rlw 'WC_ERR_INVALID_CHARS' --include='*.c' --include='*.h' --include='*.cpp' --include='*.cc' . || true)"
          count=0
          if [ -n "$files" ]; then
            while IFS= read -r f; do
              sed -i 's/\bWC_ERR_INVALID_CHARS\b/0/g' "$f"
              count=$((count + 1))
              echo "patched: $f"
            done <<<"$files"
          fi
          if grep -rqw 'WC_ERR_INVALID_CHARS' --include='*.c' --include='*.h' --include='*.cpp' --include='*.cc' . ; then
            echo "::error::Ainda ha referencias a WC_ERR_INVALID_CHARS"
            exit 1
          fi
          echo "$count ficheiro(s) alterado(s)"
          echo "::endgroup::"

          # ---------- Patch XP 2: camada de compatibilidade (SRWLock/CondVar/InitOnce) ----------
          echo "::group::Patch XP 2 (camada de compatibilidade)"
          cat > compat/xp_compat.h <<'XPH'
          #ifndef XP_COMPAT_H
          #define XP_COMPAT_H

          #include <windows.h>

          #ifdef __cplusplus
          extern "C" {
          #endif

          #ifndef INIT_ONCE_CHECK_ONLY
          #define INIT_ONCE_CHECK_ONLY 0x00000001UL
          #endif
          #ifndef INIT_ONCE_ASYNC
          #define INIT_ONCE_ASYNC 0x00000002UL
          #endif
          #ifndef INIT_ONCE_INIT_FAILED
          #define INIT_ONCE_INIT_FAILED 0x00000004UL
          #endif

          void    WINAPI InitializeSRWLock(PSRWLOCK l);
          void    WINAPI AcquireSRWLockExclusive(PSRWLOCK l);
          void    WINAPI ReleaseSRWLockExclusive(PSRWLOCK l);
          BOOLEAN WINAPI TryAcquireSRWLockExclusive(PSRWLOCK l);

          void    WINAPI InitializeConditionVariable(PCONDITION_VARIABLE cv);
          void    WINAPI WakeConditionVariable(PCONDITION_VARIABLE cv);
          void    WINAPI WakeAllConditionVariable(PCONDITION_VARIABLE cv);
          BOOL    WINAPI SleepConditionVariableSRW(PCONDITION_VARIABLE cv, PSRWLOCK srw,
                                                   DWORD ms, ULONG flags);

          BOOL    WINAPI InitOnceBeginInitialize(PINIT_ONCE once, DWORD flags,
                                                 PBOOL pending, LPVOID *ctx);
          BOOL    WINAPI InitOnceComplete(PINIT_ONCE once, DWORD flags, LPVOID ctx);

          /* Vista+: usa a API real se existir, senao falha de forma limpa */
          BOOL    WINAPI CancelSynchronousIo(HANDLE thread);

          #ifdef __cplusplus
          }
          #endif

          #endif
          XPH

          cat > compat/xp_compat.c <<'XPC'
          #include <windows.h>
          #include <stddef.h>
          #include "xp_compat.h"

          /* ---------- espera com recuo progressivo ---------- */
          static void xp_backoff(unsigned *n)
          {
              unsigned i = (*n)++;
              if (i < 100)
                  __asm__ __volatile__("pause" ::: "memory");
              else if (i < 300)
                  SwitchToThread();
              else if (i < 600)
                  Sleep(0);
              else
                  Sleep(1);
          }

          /* ---------- SRWLOCK (spinlock exclusivo) ---------- */
          void WINAPI InitializeSRWLock(PSRWLOCK l)
          {
              l->Ptr = NULL;
          }

          void WINAPI AcquireSRWLockExclusive(PSRWLOCK l)
          {
              unsigned n = 0;
              while (InterlockedCompareExchangePointer(&l->Ptr, (PVOID)1, NULL) != NULL)
                  xp_backoff(&n);
          }

          void WINAPI ReleaseSRWLockExclusive(PSRWLOCK l)
          {
              InterlockedExchangePointer(&l->Ptr, NULL);
          }

          BOOLEAN WINAPI TryAcquireSRWLockExclusive(PSRWLOCK l)
          {
              return (BOOLEAN)(InterlockedCompareExchangePointer(&l->Ptr, (PVOID)1, NULL) == NULL);
          }

          /* ---------- CONDITION_VARIABLE (lista de espera) ---------- */
          typedef struct xp_waiter {
              struct xp_waiter *next;
              HANDLE ev;
          } xp_waiter;

          static volatile LONG g_cv_lock = 0;

          static void cv_lock(void)
          {
              unsigned n = 0;
              while (InterlockedCompareExchange(&g_cv_lock, 1, 0) != 0)
                  xp_backoff(&n);
          }

          static void cv_unlock(void)
          {
              InterlockedExchange(&g_cv_lock, 0);
          }

          static void cv_append(PCONDITION_VARIABLE cv, xp_waiter *w)
          {
              xp_waiter **pp = (xp_waiter **)&cv->Ptr;
              while (*pp)
                  pp = &(*pp)->next;
              *pp = w;
          }

          static int cv_remove(PCONDITION_VARIABLE cv, xp_waiter *w)
          {
              xp_waiter **pp = (xp_waiter **)&cv->Ptr;
              while (*pp) {
                  if (*pp == w) {
                      *pp = w->next;
                      return 1;
                  }
                  pp = &(*pp)->next;
              }
              return 0;
          }

          void WINAPI InitializeConditionVariable(PCONDITION_VARIABLE cv)
          {
              cv->Ptr = NULL;
          }

          void WINAPI WakeConditionVariable(PCONDITION_VARIABLE cv)
          {
              xp_waiter *w;
              cv_lock();
              w = (xp_waiter *)cv->Ptr;
              if (w) {
                  HANDLE h = w->ev;
                  cv->Ptr = w->next;
                  SetEvent(h);
              }
              cv_unlock();
          }

          void WINAPI WakeAllConditionVariable(PCONDITION_VARIABLE cv)
          {
              xp_waiter *w;
              cv_lock();
              w = (xp_waiter *)cv->Ptr;
              cv->Ptr = NULL;
              while (w) {
                  xp_waiter *next = w->next;
                  HANDLE h = w->ev;
                  SetEvent(h);
                  w = next;
              }
              cv_unlock();
          }

          BOOL WINAPI SleepConditionVariableSRW(PCONDITION_VARIABLE cv, PSRWLOCK srw,
                                                DWORD ms, ULONG flags)
          {
              xp_waiter w;
              DWORD r;
              int signaled;
              (void)flags;

              w.next = NULL;
              w.ev = CreateEventA(NULL, FALSE, FALSE, NULL);
              if (!w.ev) {
                  SetLastError(ERROR_NOT_ENOUGH_MEMORY);
                  return FALSE;
              }

              cv_lock();
              cv_append(cv, &w);
              cv_unlock();

              ReleaseSRWLockExclusive(srw);
              r = WaitForSingleObject(w.ev, ms);
              signaled = (r == WAIT_OBJECT_0);

              if (!signaled) {
                  cv_lock();
                  if (!cv_remove(cv, &w))
                      signaled = 1;           /* um Wake chegou ao mesmo tempo */
                  cv_unlock();
                  if (signaled)
                      WaitForSingleObject(w.ev, INFINITE);
              }

              CloseHandle(w.ev);
              AcquireSRWLockExclusive(srw);

              if (!signaled) {
                  SetLastError(ERROR_TIMEOUT);
                  return FALSE;
              }
              return TRUE;
          }

          /* ---------- INIT_ONCE (0 = por fazer, 1 = a correr, ctx|2 = feito) ---------- */
          BOOL WINAPI InitOnceBeginInitialize(PINIT_ONCE once, DWORD flags,
                                              PBOOL pending, LPVOID *ctx)
          {
              unsigned n = 0;

              if (flags & INIT_ONCE_CHECK_ONLY) {
                  PVOID cur = once->Ptr;
                  if (((ULONG_PTR)cur & 3) == 2) {
                      *pending = FALSE;
                      if (ctx)
                          *ctx = (PVOID)((ULONG_PTR)cur & ~(ULONG_PTR)3);
                      return TRUE;
                  }
                  SetLastError(ERROR_GEN_FAILURE);
                  return FALSE;
              }

              for (;;) {
                  PVOID old = InterlockedCompareExchangePointer(&once->Ptr, (PVOID)1, NULL);
                  if (old == NULL) {
                      *pending = TRUE;
                      return TRUE;
                  }
                  if (((ULONG_PTR)old & 3) == 2) {
                      *pending = FALSE;
                      if (ctx)
                          *ctx = (PVOID)((ULONG_PTR)old & ~(ULONG_PTR)3);
                      return TRUE;
                  }
                  xp_backoff(&n);
              }
          }

          BOOL WINAPI InitOnceComplete(PINIT_ONCE once, DWORD flags, LPVOID ctx)
          {
              if (flags & INIT_ONCE_INIT_FAILED)
                  InterlockedExchangePointer(&once->Ptr, NULL);
              else
                  InterlockedExchangePointer(&once->Ptr, (PVOID)((ULONG_PTR)ctx | 2));
              return TRUE;
          }

          /* ---------- CancelSynchronousIo (Vista+) ---------- */
          BOOL WINAPI CancelSynchronousIo(HANDLE thread)
          {
              typedef BOOL (WINAPI *fn_t)(HANDLE);
              fn_t fn = (fn_t)GetProcAddress(GetModuleHandleA("kernel32.dll"), "CancelSynchronousIo");
              if (!fn) {
                  SetLastError(ERROR_CALL_NOT_IMPLEMENTED);
                  return FALSE;
              }
              return fn(thread);
          }

          /* ---------- pthread_gethandle (usado pelo udp.c do fork) ----------
             O primeiro campo de pthread_t no w32pthreads e o handle da thread. */
          typedef struct xp_pthread_s {
              void *handle;
              void *(*func)(void *);
              void *arg;
              void *ret;
          } xp_pthread_s;

          HANDLE pthread_gethandle(xp_pthread_s thread)
          {
              return (HANDLE)thread.handle;
          }
          XPC

          test -f compat/w32pthreads.h || { echo "::error::compat/w32pthreads.h nao existe"; exit 1; }
          python3 - <<'PY'
          import re, sys
          p = 'compat/w32pthreads.h'
          with open(p, 'r', encoding='utf-8', errors='surrogateescape', newline='') as f:
              s = f.read()
          if '"xp_compat.h"' in s:
              print('w32pthreads.h ja tinha xp_compat.h')
              sys.exit(0)
          new, n = re.subn(r'(?m)^(#[ \t]*include[ \t]*<windows\.h>[^\r\n]*(\r?\n))',
                           lambda m: m.group(1) + '#include "xp_compat.h"' + m.group(2), s, count=1)
          if n != 1:
              print('::error::#include <windows.h> nao encontrado em compat/w32pthreads.h')
              sys.exit(1)
          with open(p, 'w', encoding='utf-8', errors='surrogateescape', newline='') as f:
              f.write(new)
          print('w32pthreads.h alterado')
          PY
